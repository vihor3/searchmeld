name: Dependency remediation evidence

on:
  push:
    branches: [fix/admin-cookie-security]
    paths: [.github/workflows/dependency-remediation.yml]

permissions:
  contents: read

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/dependency-evidence"
      - name: Capture complete npm advisory details without install scripts
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          status=0
          npm audit --json > "$RUNNER_TEMP/dependency-evidence/npm-before.json" || status=$?
          test "$status" -le 1
          jq -e 'has("metadata") and (has("error") | not)' "$RUNNER_TEMP/dependency-evidence/npm-before.json"
          jq '.metadata.vulnerabilities, .vulnerabilities' "$RUNNER_TEMP/dependency-evidence/npm-before.json"
      - name: Install the pinned Go vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Capture Go reachability and module advisory details
        working-directory: backend
        run: |
          govulncheck -format json ./... > "$RUNNER_TEMP/dependency-evidence/go-before.json"
          jq -s '[.[] | select(has("finding"))]' "$RUNNER_TEMP/dependency-evidence/go-before.json"
      - name: Upload dependency evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-evidence/*.json
          if-no-files-found: error
          retention-days: 7
